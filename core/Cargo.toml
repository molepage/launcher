[package]
name = "launcher-core"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.191"
nucleo-matcher = "0.3.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
toml_edit = "0.23"

[dev-dependencies]
tempfile = "3.27.0"

[lib]
crate-type = ["staticlib", "rlib"]
