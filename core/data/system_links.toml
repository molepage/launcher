# Built-in deep links into System Settings panes, compiled into the core.
#
# Per entry:
#   anchor    id used in config.toml's `system_links` selection
#   title     display name (also becomes a search alias)
#   keywords  extra search aliases
#   target    the destination: a full `x-apple.systempreferences:` URL
#             (url = true) or an AppleScript pane id (url = false) for the
#             few panes that don't support the URL scheme
#   min_os / max_os  optional macOS major-version gates. Entries whose
#             target only exists in a macOS generation carry one; targets
#             kept working by Apple for compatibility stay ungated.
#
# When a macOS release moves a pane, add the new target as a second row
# with the same anchor and a complementary min_os/max_os, or override the
# entry from config.toml with a [[syslink]] table.

[[entry]]
anchor = "accessibility"
title = "Accessibility"
target = "x-apple.systempreferences:com.apple.preference.security?Privacy_Accessibility"
url = true

[[entry]]
anchor = "firewall"
title = "Firewall"
target = "x-apple.systempreferences:com.apple.preference.security?Firewall"
url = true

[[entry]]
anchor = "filevault"
